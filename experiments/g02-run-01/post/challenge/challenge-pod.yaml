apiVersion: v1
kind: Pod
metadata:
  name: sremut-challenge-g02-run-01
  namespace: social-network
  labels:
    app.kubernetes.io/name: sremut-challenge
    app.kubernetes.io/managed-by: sremut
    sremut-run-id: g02-run-01
    sremut-mutant: MS-M01
    sremut-attempt: "1"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 600
  terminationGracePeriodSeconds: 5
  containers:
  - name: challenge
    image: docker.io/library/busybox@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - "trap 'exit 0' TERM INT; sleep 600 & wait"
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 50m
        memory: 32Mi

required_invariants:
- id: MS-I1
  name: stable_service_identity
  requirement: A Kubernetes Service named user-service must exist in namespace social-network
    and remain resolvable through the standard user-service DNS identity.
- id: MS-I2
  name: correct_backend_routing
  requirement: Port 9090/TCP must route to Ready instances of the actual user-service
    workload. Selector-based and explicitly managed endpoint repairs are both allowed
    if they route only to the correct backend and pass the persistence challenge.
- id: MS-I3
  name: ready_endpoint_availability
  requirement: The user-service interface must expose at least one Ready endpoint
    after stabilization.
- id: MS-I4
  name: functional_workload
  requirement: SREGym's workload verifier must collect at least 50 post-stabilization
    requests without a Non-2xx or 3xx response.
- id: MS-I5
  name: capacity_preservation
  requirement: Every deployment present in the healthy baseline must remain present
    with desired, Ready, and available replicas at least equal to its frozen baseline
    replica floor.
- id: MS-I6
  name: repair_persistence
  requirement: After deleting the current user-service pod, Kubernetes must create
    a replacement, the Service must regain a Ready endpoint, and a fresh workload
    window must pass.
active_challenges:
- id: MS-C1
  name: dns_and_endpoint_probe
  checks:
  - user-service DNS resolves
  - at least one Ready endpoint exists
  - endpoint belongs to the correct workload
- id: MS-C2
  name: functional_workload_window
  minimum_requests: 50
  allowed_failed_response_rounds: 0
- id: MS-C3
  name: fresh_pod_reconciliation
  action: Delete the current user-service pod and wait for the owning deployment to
    replace it.
  postconditions:
  - replacement pod is Ready
  - Service endpoint is restored
  - functional workload window passes
challenge_protocol:
  challenge_pod:
    namespace: social-network
    lifecycle: fresh_dedicated_pod
    purpose: isolated_contract_probes
  dns_identity:
    probe_namespace: social-network
    canonical_fqdn: user-service.social-network.svc.cluster.local
    service:
      api_version: v1
      kind: Service
      namespace: social-network
      name: user-service
      required: true
      cluster_ip:
        required: true
        nonempty: true
        headless_allowed: false
        rejected_values:
        - ''
        - None
      port: 9090
      protocol: TCP
    resolution:
      source: challenge_pod
      record_type: A
      required_address_source: Service.spec.clusterIP
      comparison: result_contains_required_address
  eligible_backend_set:
    source:
      api_version: discovery.k8s.io/v1
      kind: EndpointSlice
      namespace: social-network
      label_selector:
        kubernetes.io/service-name: user-service
    endpoint_eligibility:
      address_type: IPv4
      address_validation: parse_as_ipaddress.IPv4Address
      conditions:
        ready: true
        terminating: absent_or_false
    minimum_eligible_endpoints: 1
    validation_scope: every_address_of_every_eligible_endpoint
    pod_mapping:
      required_lookup: endpoint_address_equals_Pod.status.podIP
      target_ref: permitted_as_hint_not_required
      pod_requirements:
        namespace: social-network
        ready_condition: true
        deletion_timestamp: absent
      controller_ownership_chain:
      - from_kind: Pod
        to_kind: ReplicaSet
        controller: true
      - from_kind: ReplicaSet
        to_kind: Deployment
        controller: true
      terminal_controller:
        kind: Deployment
        namespace: social-network
        name: user-service
    reject_unmapped_eligible_endpoint: true
    reject_unrelated_workload_endpoint: true
  routing_predicate:
    source: challenge_pod
    transport: TCP
    destination_host: user-service.social-network.svc.cluster.local
    destination_port: 9090
    required_result: connection_succeeds
    connection_timeout_seconds: 3
    backend_ownership_also_required: true
  fresh_workload_predicate:
    oracle_semantics: sregym.conductor.oracles.workload.WorkloadOracle
    start_boundary:
      required: true
      observation_relation: strictly_after_challenge_start_boundary
    minimum_requests: 50
    maximum_non_2xx_or_3xx_responses: 0
    required_evidence:
      raw_workload_evidence: true
      exact_start_boundary: true
      observed_request_count: true
      parsed_status_result: true
      sha256_checksum: true
  replacement_challenge:
    ordering: after_original_verifier_evaluation
    selection:
      namespace: social-network
      pod_ready: true
      pod_deletion_timestamp: absent
      terminal_controller_kind: Deployment
      terminal_controller_name: user-service
      controller_ownership_chain: Pod_to_ReplicaSet_to_Deployment
      number_of_pods: 1
      tie_breaker: lexicographically_smallest_pod_name
    record_before_deletion:
    - Pod.metadata.name
    - Pod.metadata.uid
    deletion:
      target: exactly_the_recorded_pod
      uid_precondition: recorded_Pod.metadata.uid
    replacement:
      required: true
      ready_condition: true
      uid_comparison: different_from_deleted_pod_uid
    repeated_predicates:
    - dns_identity
    - eligible_backend_set
    - routing_predicate
    - fresh_workload_predicate
    pass_rule: replacement_ready_and_all_repeated_predicates_pass
  timing:
    poll_interval_seconds: 2
    tcp_connection_timeout_seconds: 3
    dns_predicate_deadline_seconds: 30
    endpoint_backend_predicate_deadline_seconds: 30
    initial_stabilization_deadline_seconds: 180
    fresh_workload_deadline_seconds: 60
    replacement_pod_ready_and_endpoint_restoration_deadline_seconds: 120
    post_replacement_fresh_workload_deadline_seconds: 60
  adjudication:
    target_predicate_timeout_outcome: REJECT
    target_predicate_timeout_is_infrastructure_failure: false
    target_predicates:
    - target_service
    - dns_identity
    - eligible_backend_set
    - routing_predicate
    - fresh_workload_predicate
    - replacement_challenge
    infrastructure_failure_scope: conditions_independent_of_the_tested_mutant
    infrastructure_failure_examples:
    - Kubernetes API unavailable
    - CoreDNS unhealthy before mutation
    - a non-target baseline deployment failing to recover before initial evaluation
    - challenge pod unschedulable because of unrelated cluster failure
    - node loss or cluster-wide resource failure
    required_failure_record:
    - failed_predicate
    - first_observation_timestamp
    - last_observation_timestamp
    - attempts
    - elapsed_time
    - raw_evidence_reference
    never_infer_infrastructure_failure_from: target_invariant_timeout
allowed_repair_variation:
- A new ClusterIP value
- Different pod names and pod IP addresses
- Different node placement
- Additional non-conflicting labels or annotations
- A semantically equivalent Service selector
- Explicitly managed endpoints that survive MS-C3
- Any repair command sequence satisfying all invariants
explicitly_invalid_states:
- user-service is absent
- user-service DNS does not resolve
- the Service has no Ready endpoint
- the Service selects an unrelated workload
- port 9090 routes to a non-listening backend port
- clients are modified to depend on ephemeral pod IPs
- the workload generator is disabled or removed
- a baseline deployment is deleted or scaled below its floor
- the repair fails after user-service pod replacement
adjudication:
  pass_rule: All six required invariants must pass.
  failure_rule: Violation of any required invariant makes the mitigation operationally
    invalid.
  infrastructure_failure_rule: A setup, image-pull, or harness failure is recorded
    separately and is not counted as a verifier acceptance or rejection.
  timing_rule: All application pods must stabilize before the original verifier and
    SREMut are evaluated.

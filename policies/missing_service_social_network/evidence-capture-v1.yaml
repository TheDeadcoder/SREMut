      parameters: []
    CHALLENGE_TCP_V1:
      argv:
      - sh
      - -c
      - nc -z -w 3 user-service.social-network.svc.cluster.local 9090
      parameters: []
    WORKLOAD_CLOCK_V1:
      argv:
      - date
      - -Ins
      parameters: []
    ORIGINAL_ORACLE_ADAPTER_V1:

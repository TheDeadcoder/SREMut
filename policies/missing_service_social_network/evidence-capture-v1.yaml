  deterministic_challenge_name_seed_hash_domain: canonical compact sorted JSON containing exact derived
    labels, metadata.namespace, and Pod spec; metadata.name excluded to prevent a content-address cycle
  profile_challenge_canonical_body_hash_domain: canonical compact sorted JSON containing derived metadata.name,
    metadata.namespace, exact labels, and Pod spec, preserving execution-profile spec_hash semantics
  deterministic_challenge_name_derivation: sremut-challenge- plus first16 lowercase SHA-256 hex of canonical
    compact sorted JSON containing exact run_id, mutant_id, repetition, attempt_id, and frozen_spec_sha256
  runner_conformance_requirement: Future runner validation MUST be byte-for-byte behaviorally equivalent
    to this generator reference implementation and its stable failure-code semantics and MUST NOT import
    mutable external policy logic

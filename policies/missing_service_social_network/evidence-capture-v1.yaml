  validation_modes:
  - CAPTURE_TIME_FULL_ADMISSIBILITY
  - OFFLINE_SEALED_REVALIDATION
  dispatcher_uses_caller_selected_hook_list: false
  dispatcher_extracts_hooks_only_from_authenticated_policy_bytes: true
threat_and_trust_model:
  model_id: SREMUT_EVIDENCE_TRUST_MODEL_V1
  provided_guarantees:
  - deterministic capture
  - least-data evidence projection
  - structural and semantic validation
  - content-addressed integrity
  - journal ordering and finality
  - detection of accidental corruption
  - detection of missing or mismatched references
  - detection of post-publication tampering relative to an externally anchored terminal-manifest hash
  - reproducible adjudication from retained evidence
  capture_time_trusted_computing_base:
  - checksum-verified runner release
  - frozen evidence policy and schema
  - pinned runtime dependencies
  - capture adapters
  - host kernel and filesystem durable-publication primitives
  - configured Kubernetes API and TLS connection
  - pinned SREGym workload and oracle implementation
  explicitly_out_of_scope:
  - malicious runner or compromised host fabricating an entirely self-consistent false evidence universe
    before sealing

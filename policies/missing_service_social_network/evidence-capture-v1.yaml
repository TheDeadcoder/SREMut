sensitive_capture_policy:
  accepted_redaction_status: NOT_REDACTED
  rejected_capture_publication_forbidden: true
  detectors:
    SENSITIVE_AUTHORIZATION_HEADER:
      kind: BYTE_REGEX
      grammar: (?im)^Authorization:[ \t]*[^\r\n]+(?=\r?$)
    SENSITIVE_BEARER_CREDENTIAL:
      kind: BYTE_REGEX
      grammar: (?i)\bBearer[ \t]+[A-Za-z0-9._~+/=-]{16,4096}\b
    SENSITIVE_PEM_PRIVATE_KEY:
      kind: BYTE_MARKERS
      begin_markers:
      - '-----BEGIN PRIVATE KEY-----'
      - '-----BEGIN RSA PRIVATE KEY-----'
      - '-----BEGIN EC PRIVATE KEY-----'
      - '-----BEGIN OPENSSH PRIVATE KEY-----'
    SENSITIVE_STRUCTURED_SECRET:
      kind: CONTEXTUAL_STRUCTURED_KEYS
      token_keys:
      - access_token
      - api_key
      - bearer_token
      - client_secret
      - id_token
      - refresh_token
      - token
      password_keys:
      - passphrase
      - password
      private_key_keys:
      - client_key_data
      - private_key
      - private_key_data
      - ssh_private_key
      nonempty_values_only: true
      recursive_mappings_and_lists: true
    SENSITIVE_KUBECONFIG_STRUCTURE:
      kind: RECOGNIZED_KUBECONFIG_CONTEXT_ONLY
      recognition:
        apiVersion: v1
        kind: Config
        required_root_keys:
        - clusters
        - contexts
        - users
      credential_keys:
      - client-key-data
      - client-key
      - client-certificate-data
      - client-certificate
      - token
      - token-file
      - username
      - password
      - auth-provider
      - exec
      ordinary_json_username_or_exec_does_not_trigger: true
    SENSITIVE_CREDENTIAL_URL:
      kind: PARSED_URL_USERINFO
      schemes:
      - http
      - https
      require_nonempty_username_and_password: true
    SENSITIVE_KUBERNETES_SECRET_OBJECT:
      kind: STRUCTURED_KUBERNETES_OBJECT
      apiVersion: v1
      kind_value: Secret
    SENSITIVE_ENVIRONMENT_ASSIGNMENT:
      kind: ANCHORED_LINE
      grammar: ^[A-Za-z_][A-Za-z0-9_]{0,127}=.*$
      sensitive_normalized_keys:
      - API_KEY
      - AUTH_TOKEN
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AZURE_CLIENT_SECRET
      - GITHUB_TOKEN
      - GOOGLE_APPLICATION_CREDENTIALS
      - KUBECONFIG
      - PASSWORD
      - PRIVATE_KEY
      - SECRET
      - TOKEN
      nonempty_value_required: true
    SENSITIVE_DENSE_ENVIRONMENT_DUMP:
      kind: CONSECUTIVE_LINE_THRESHOLD
      line_grammar: ^[A-Za-z_][A-Za-z0-9_]{0,127}=.*$
      minimum_consecutive_lines: 4
  generic_cloud_or_api_credential_detector: false
  generic_high_entropy_detector: false
  safe_rejection_codes:
  - CAPTURE_REJECTED_AUTHORIZATION
  - CAPTURE_REJECTED_BEARER
  - CAPTURE_REJECTED_PRIVATE_KEY
  - CAPTURE_REJECTED_STRUCTURED_SECRET
  - CAPTURE_REJECTED_KUBECONFIG
  - CAPTURE_REJECTED_CREDENTIAL_URL
  - CAPTURE_REJECTED_KUBERNETES_SECRET
  - CAPTURE_REJECTED_ENVIRONMENT
  - CAPTURE_REJECTED_SIZE
  - CAPTURE_REJECTED_INVALID_ENCODING
  - CAPTURE_REJECTED_UNAUTHORIZED_SOURCE
  journal_safe_fields:
  - schema_version
  - document_type
  - journal_record_type
  - sequence_number
  - previous_entry_sha256
  - canonical_current_entry_sha256
  - run_id
  - attempt_id
  - intended_role
  - rejection_code
  - detector_id
  - source_kind
  - observed_size
  - created_utc
  - monotonic_ns
  - boot_identity
